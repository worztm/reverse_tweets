<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000"/>
      <stop offset="50%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#000000"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="1050" cy="150" r="200" fill="#3b82f6" opacity="0.08"/>
  <circle cx="200" cy="500" r="180" fill="#8b5cf6" opacity="0.06"/>
  <circle cx="600" cy="315" r="120" fill="#3b82f6" opacity="0.04"/>
  <!-- Top bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>
  <!-- Title -->
  <text x="600" y="250" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-style="italic" fill="#FAFAF8" text-anchor="middle" font-weight="700">TweetsReverse.lol</text>
  <!-- Subtitle -->
  <text x="600" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#94a3b8" text-anchor="middle" font-weight="500">Paste a tweet. Get it roasted, reversed, &amp; remixed.</text>
  <!-- Tagline -->
  <rect x="440" y="370" width="320" height="48" rx="24" fill="#3b82f6" opacity="0.15"/>
  <text x="600" y="401" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#3b82f6" text-anchor="middle" font-weight="600">AI-Powered Tweet Roaster</text>
  <!-- Bottom bar -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#accent)"/>
</svg>
